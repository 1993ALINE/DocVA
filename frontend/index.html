<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/docva-logo.jfif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4260E9" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/splash.css" />
    <title>DOCVA · Clinical documentation</title>
    <!-- Critical splash: shows before Vite/React bundle loads. #root stays hidden until splash is gone so the fade never reveals a second logo underneath. -->
  </head>
  <body>
    <div id="anot-splash" class="anot-splash" aria-busy="true" aria-label="Loading">
      <div class="anot-splash__logo-wrap">
        <span class="anot-splash__ring" aria-hidden="true"></span>
        <img
          class="anot-splash__logo"
          src="/brand/docva-logo.jfif"
          alt=""
          width="120"
          height="120"
          decoding="async"
          fetchpriority="high"
        />
      </div>
      <p class="anot-splash__label">DOCVA</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
